<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Course Songs</title>
  <meta name="color-scheme" content="dark light" />
  <style>
    :root{
      --bg0:#05714B;
      --bg1:#05714B;
      --card: rgba(255,255,255,.08);
      --stroke: rgba(255,255,255,.16);
      --text: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.65);
      --shadow: 0 18px 60px rgba(0,0,0,.45);
      --radius: 22px;
      --pad: 16px;
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
      color:var(--text);
      background:
        radial-gradient(1200px 600px at 20% 10%, rgba(92,255,214,.18), transparent 60%),
        radial-gradient(900px 600px at 80% 20%, rgba(92,162,255,.18), transparent 55%),
        radial-gradient(800px 800px at 60% 90%, rgba(255,92,214,.12), transparent 55%),
        linear-gradient(160deg, var(--bg0), var(--bg1));
      display:flex;
      justify-content:center;
      padding: clamp(14px, 3vw, 28px);
    }

    .page{ width:min(1200px, 100%); }

    header{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:16px;
      margin-bottom: clamp(12px, 2.5vw, 22px);
    }

    .title h1{
      margin:0;
      font-size: clamp(22px, 4.6vw, 40px);
      letter-spacing: .2px;
      line-height: 1.1;
    }
    .title p{
      margin:10px 0 0 0;
      color:var(--muted);
      font-size: clamp(13px, 2.8vw, 15px);
    }

    .badge{
      padding:10px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.12);
      color: rgba(255,255,255,.80);
      font-size: 12px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      white-space: nowrap;
    }

    /* Uniform grid: all cards same width rules */
    .grid{
      display:grid;
      grid-template-columns: 1fr;              /* mobile: 1 column */
      gap: clamp(12px, 2.6vw, 18px);
    }
    @media (min-width: 860px){
      .grid{ grid-template-columns: repeat(3, 1fr); } /* desktop: 3 aligned columns */
    }

    .card{
      background: var(--card);
      border: 1px solid var(--stroke);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow:hidden;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display:flex;
      flex-direction: column;
      min-width: 0;
    }

    .meta{
      padding: var(--pad);
      padding-bottom: 12px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      border-bottom: 1px solid rgba(255,255,255,.10);
    }

    .name{
      font-weight: 750;
      font-size: 15px;
      letter-spacing:.2px;
      white-space: nowrap;
      overflow:hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }

    .file{
      color: var(--muted);
      font-size: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      white-space: nowrap;
      overflow:hidden;
      text-overflow: ellipsis;
      max-width: 55%;
      text-align:right;
      min-width: 0;
    }

    /* Same video window size for all cards */
    .video-wrap{
      position: relative;
      width:100%;
      aspect-ratio: 16 / 9;   /* consistent window */
      background: rgba(0,0,0,.55); /* letterbox background */
    }

    video{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      display:block;

      /* KEY FIX: do NOT crop faces/edges */
      object-fit: contain;
    }

    /* Optional small footer line, kept consistent height */
    .hint{
      padding: 12px var(--pad) 14px var(--pad);
      color: var(--muted);
      font-size: 13px;
      min-height: 44px; /* keeps cards visually equal even if text differs */
      border-top: 1px solid rgba(255,255,255,.10);
    }
  </style>
</head>

<body>
  <main class="page">
    <header>
      <div class="title">
        <h1>Course Songs</h1>
      </div>
      <div class="badge">Courses</div>
    </header>

    <section class="grid">
      <article class="card">
        <div class="meta">
          <div class="name">COS-109</div>
          <div class="file">C++ Overview</div>
        </div>
        <div class="video-wrap">
          <video controls playsinline preload="metadata">
            <source src="CPlusPlus.mp4" type="video/mp4" />
            Course: Principle of Computer Science Foundation II.
          </video>
        </div>
        <div class="hint">Principle of Computer Science Foundation II. <a href="https://kysu.instructure.com/courses/7060" target="_blank">Course Canvas Link</a></div>
      </article>

      <article class="card">
        <div class="meta">
          <div class="name">COS 200</div>
          <div class="file">Course Introduction</div>
        </div>
        <div class="video-wrap">
          <video controls playsinline preload="metadata">
            <source src="COS200.mp4" type="video/mp4" />
            Computer Information Systems.
          </video>
        </div>
        <div class="hint">Computer Information Systems. <a href="https://kysu.instructure.com/courses/7063" target="_blank">Course Canvas Link</a>
</div>
      </article>

      <article class="card">
        <div class="meta">
          <div class="name">COS 506</div>
          <div class="file">Course Introduction</div>
        </div>
        <div class="video-wrap">
          <video controls playsinline preload="metadata">
            <source src="COS506.mp4" type="video/mp4" />
            Advanced Programming/Data Structures.
          </video>
        </div>
        <div class="hint">Advanced Programming/Data Structures. <a href="https://kysu.instructure.com/courses/7061" target="_blank">Course Canvas Link</a></div>
      </article>
    </section>
  </main>
</body>
</html>
