<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quick Links</title>

  <style>
    :root{
      --bg1: #0b1220;
      --bg2: #111827;

      --card: rgba(255, 255, 255, 0.06);
      --card-border: rgba(255, 255, 255, 0.14);

      --item: rgba(255, 255, 255, 0.05);
      --item-border: rgba(255, 255, 255, 0.10);

      --text: #e5e7eb;
      --muted: rgba(229, 231, 235, 0.78);
      --muted2: rgba(229, 231, 235, 0.65);
    }

    *{
      box-sizing: border-box;
    }

    body{
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.55;
      color: var(--text);
      background: linear-gradient(135deg, var(--bg1), var(--bg2), var(--bg1));
    }

    main{
      width: min(720px, 92vw);
      padding: 28px;
      border-radius: 20px;
      background: var(--card);
      border: 1px solid var(--card-border);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(10px);
    }

    h1{
      margin: 0 0 12px;
      font-size: 28px;
      letter-spacing: 0.2px;
    }

    p{
      margin: 0 0 18px;
      color: var(--muted);
    }

    ul{
      margin: 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 10px;
    }

    a.link{
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border-radius: 14px;
      text-decoration: none;
      color: var(--text);

      background: var(--item);
      border: 1px solid var(--item-border);

      transition: transform 0.15s ease,
                  background 0.15s ease,
                  border-color 0.15s ease;
    }

    a.link:hover{
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 0.085);
      border-color: rgba(255, 255, 255, 0.22);
    }

    a.link:active{
      transform: translateY(0);
    }

    .right{
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--muted2);
      font-size: 14px;
      white-space: nowrap;
    }

    .arrow{
      opacity: 0.75;
      font-size: 16px;
    }

    footer{
      margin-top: 18px;
      color: var(--muted2);
      font-size: 13px;
    }

    code{
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      background: rgba(255, 255, 255, 0.08);
      padding: 2px 6px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.10);
    }
  </style>
</head>

<body>
  <main>
    <h1>Wu's Links</h1>
    <p>Pick a link below:</p>

    <ul>
      <li>
        <a class="link" href="https://xinxingwu-ksu.github.io/schedule/wu.html" target="_blank" rel="noopener">
          <span>Time Schedule in Spring 2026</span>
          <span class="right">
            <span class="arrow">↗</span>
          </span>
        </a>
      </li>
	  
      <li>
        <a class="link" href="https://xinxingwu-ksu.github.io" target="_blank" rel="noopener">
          <span>Interesting Projects</span>
          <span class="right">
            <span class="arrow">↗</span>
          </span>
        </a>
      </li>

      <li>
        <a class="link" href="https://google.com" target="_blank" rel="noopener">
          <span>Google</span>
          <span class="right">
            <span class="arrow">↗</span>
          </span>
        </a>
      </li>

    </ul>

  </main>
</body>
</html>
