<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>3D Particle Transformer</title>
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at center,#07182e,#000);color:white;font-family:Arial,sans-serif}
  body{position:relative}
  #panel{
    position:absolute;top:15px;left:15px;z-index:10;width:455px;
    background:rgba(0,0,0,.74);padding:16px;border-radius:16px;
    box-shadow:0 0 30px rgba(0,180,255,.35);transition:left .35s;
    backdrop-filter: blur(6px);
  }
  #togglePanel{position:absolute;top:15px;right:-70px;background:green;padding:10px;border-radius:10px;cursor:pointer;font-weight:bold}
  h2{margin:0 0 8px 0;font-size:22px;line-height:1.2}
  p{margin:8px 0}
  input{width:250px;padding:10px;border-radius:8px;border:none;outline:none}
  .sliderRow{display:grid;grid-template-columns:125px 1fr 48px;gap:8px;align-items:center;margin:8px 0}
  input[type=range]{width:100%;padding:0;margin:0;accent-color:green;cursor:pointer}
  input[type=file]{width:320px;padding:0;background:transparent;color:white}
  button{padding:9px 11px;margin:4px;border:none;border-radius:8px;background:green;color:white;font-weight:bold;cursor:pointer}
  button:hover{background:#48a4ff}
  #heard{color:#00ffd5;font-weight:bold}
  #status{color:#ffdf70;font-size:14px;line-height:1.4}
  #shapeCanvas,#previewCanvas,#maskCanvas{display:none}
</style>
</head>
<body>
<div id="panel">
  <div id="togglePanel" onclick="togglePanel()">Hide</div>
  <h2>3D Particle Transformer</h2>
  <p>Type or say: lion, fish, car, tree, butterfly, heart, robot, spaceship, dragon, flower, galaxy.</p>
  <input id="promptInput" placeholder="Type object, e.g. lion">
  <button onclick="createFromInput()">Create</button><button onclick="startVoice()">Voice</button><button onclick="makeLargeSpace()">Space</button><br>
  <input type="file" id="uploadInput" accept="image/*" onchange="handleUpload(event)"><br><br>
  <div class="sliderRow"><label>Particle Size:</label><input id="particleSizeSlider" type="range" min="0.6" max="5" step="0.1" value="1.6" oninput="changeParticleSize(this.value)"><span id="particleSizeValue">1.6</span></div>
  <div class="sliderRow"><label>Object Size:</label><input id="scaleSlider" type="range" min="1.0" max="4.8" step="0.05" value="2.85" oninput="changeScaleLive(this.value)" onchange="regenerateCurrentObject()"><span id="scaleValue">2.85</span></div>

  <button onclick="createObject('lion')">Lion</button><button onclick="createObject('fish')">Fish</button><button onclick="createObject('car')">Car</button><button onclick="createObject('tree')">Tree</button><button onclick="createObject('butterfly')">Butterfly</button><button onclick="createObject('robot')">Robot</button><button onclick="createObject('spaceship')">Spaceship</button>
  <p>Heard: <span id="heard">Nothing yet</span></p><p id="status">Ready. Lion is more realistic now, car uses clearer wheels, and uploaded portraits now have stronger naked-eye 3D.</p>
</div>
<canvas id="shapeCanvas" width="1000" height="1000"></canvas>
<canvas id="previewCanvas" width="1000" height="1000"></canvas>
<canvas id="maskCanvas" width="1000" height="1000"></canvas>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
var scene,camera,renderer,particleGroup,particles,geometry,material;
var particleCount=160000,spaceWidth=6200,spaceHeight=4000,spaceDepth=4200,maxObjectDepth=50,objectScale=2.85;
var positions=new Float32Array(particleCount*3),targets=new Float32Array(particleCount*3),velocities=new Float32Array(particleCount*3),colors=new Float32Array(particleCount*3);
var floatAmp=new Float32Array(particleCount),floatPhase=new Float32Array(particleCount),floatAmpY=new Float32Array(particleCount);
var mouseX=0,mouseY=0,panelHidden=false,time=0,currentObjectText='lion',lastUploadImage=null,currentMode='shape';
var isDragging=false,lastDragX=0,lastDragY=0,dragMoved=false;
var rotationTargetX=0,rotationTargetY=0,rotationCurrentX=0,rotationCurrentY=0;

init();animate();

function init(){
  scene=new THREE.Scene();
  camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,12000);
  camera.position.z=2100;
  renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  document.body.appendChild(renderer.domElement);

  geometry=new THREE.BufferGeometry();
  for(var i=0;i<particleCount;i++){
    var x=(Math.random()-.5)*spaceWidth,y=(Math.random()-.5)*spaceHeight,z=(Math.random()-.5)*spaceDepth;
    positions[i*3]=x;positions[i*3+1]=y;positions[i*3+2]=z;
    targets[i*3]=x;targets[i*3+1]=y;targets[i*3+2]=z;
    colors[i*3]=.45+Math.random()*.55;colors[i*3+1]=.7+Math.random()*.3;colors[i*3+2]=1;
    floatAmp[i]=0; floatPhase[i]=Math.random()*Math.PI*2; floatAmpY[i]=0;
  }
  geometry.setAttribute('position',new THREE.BufferAttribute(positions,3));
  geometry.setAttribute('color',new THREE.BufferAttribute(colors,3));
  material=new THREE.PointsMaterial({size:1.6,vertexColors:true,transparent:true,opacity:.96,depthWrite:false,blending:THREE.AdditiveBlending});
  particles=new THREE.Points(geometry,material);
  particleGroup=new THREE.Group();
  particleGroup.add(particles);
  scene.add(particleGroup);

  createObject('lion');
  addEventListener('resize',resize);
  document.addEventListener('mousemove',function(e){
    if(!isDragging){
      mouseX=(e.clientX/innerWidth-.5)*2;
      mouseY=(e.clientY/innerHeight-.5)*2;
    }
  });
  bindRotationEvents();
}

function bindRotationEvents(){
  renderer.domElement.addEventListener('pointerdown',function(e){
    if(currentMode!=='upload') return;
    isDragging=true; dragMoved=false; lastDragX=e.clientX; lastDragY=e.clientY;
    renderer.domElement.style.cursor='grabbing';
  });
  window.addEventListener('pointermove',function(e){
    if(!isDragging || currentMode!=='upload') return;
    var dx=e.clientX-lastDragX, dy=e.clientY-lastDragY;
    if(Math.abs(dx)+Math.abs(dy)>1) dragMoved=true;
    rotationTargetY += dx*0.0065;
    rotationTargetX += dy*0.0055;
    rotationTargetX = Math.max(-0.9,Math.min(0.9,rotationTargetX));
    lastDragX=e.clientX; lastDragY=e.clientY;
    document.getElementById('status').innerText='Dragging to rotate the 3D point-cloud face.';
  });
  window.addEventListener('pointerup',function(){
    if(isDragging){
      isDragging=false;
      renderer.domElement.style.cursor=currentMode==='upload'?'grab':'default';
      if(currentMode==='upload' && dragMoved){
        document.getElementById('status').innerText='3D point-cloud face rotated. You can keep dragging to view it from different angles.';
      }
    }
  });
}

function resetRotation(){
  rotationTargetX=0;rotationTargetY=0;rotationCurrentX=0;rotationCurrentY=0;
  if(particleGroup){ particleGroup.rotation.x=0; particleGroup.rotation.y=0; }
  renderer.domElement.style.cursor=currentMode==='upload'?'grab':'default';
}

function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}

function animate(){
  requestAnimationFrame(animate);
  time+=.006;
  for(var i=0;i<particleCount;i++){
    var k=i*3;
    var tx=targets[k], ty=targets[k+1], tz=targets[k+2];
    if(currentMode==='upload'){
      tx += Math.sin(time*1.25 + floatPhase[i]) * floatAmp[i] * 0.55;
      ty += Math.cos(time*1.05 + floatPhase[i]*1.17) * floatAmpY[i] * 0.55;
      tz += Math.sin(time*1.55 + floatPhase[i]*0.85) * floatAmp[i];
    }else{
      tz += Math.sin(time+i*.012)*.012;
    }
    velocities[k]+=(tx-positions[k])*.00048;
    velocities[k+1]+=(ty-positions[k+1])*.00048;
    velocities[k+2]+=(tz-positions[k+2])*.00048;
    velocities[k]*=.972;velocities[k+1]*=.972;velocities[k+2]*=.972;
    positions[k]+=velocities[k];positions[k+1]+=velocities[k+1];positions[k+2]+=velocities[k+2];
  }
  geometry.attributes.position.needsUpdate=true;
  rotationCurrentX += (rotationTargetX-rotationCurrentX)*0.12;
  rotationCurrentY += (rotationTargetY-rotationCurrentY)*0.12;
  particleGroup.rotation.x = rotationCurrentX;
  particleGroup.rotation.y = rotationCurrentY;
  camera.position.x+=(mouseX*220-camera.position.x)*.02;
  camera.position.y+=(-mouseY*150-camera.position.y)*.02;
  camera.lookAt(scene.position);
  renderer.render(scene,camera);
}

function togglePanel(){var p=document.getElementById('panel'),t=document.getElementById('togglePanel');panelHidden=!panelHidden;p.style.left=panelHidden?'-470px':'15px';t.innerText=panelHidden?'Show':'Hide'}
function changeParticleSize(v){material.size=Number(v);document.getElementById('particleSizeValue').innerText=Number(v).toFixed(1)}
function changeScaleLive(v){objectScale=Number(v);document.getElementById('scaleValue').innerText=Number(v).toFixed(2)}
function regenerateCurrentObject(){if(lastUploadImage){var result=makeUploadMask(lastUploadImage);applyUploadPixelsToParticles(result,'upload')}else{createObject(currentObjectText)}}
function createFromInput(){var text=document.getElementById('promptInput').value.trim()||'question';createObject(text)}

function createObject(text){
  lastUploadImage=null; currentMode='shape'; currentObjectText=text; resetRotation();
  var idea=understandObject(text);
  document.getElementById('heard').innerText=text;
  document.getElementById('status').innerText='Transformation into: '+idea;
  if(idea==='galaxy'){makeGalaxy();return}
  drawSilhouetteObject(idea); canvasToParticlesFromMask(idea);
}

function understandObject(text){
  var t=text.toLowerCase();
  if(t.includes('lion')||t.includes('cat')||t.includes('tiger'))return'lion';
  if(t.includes('fish')||t.includes('shark')||t.includes('whale'))return'fish';
  if(t.includes('car')||t.includes('truck')||t.includes('bus'))return'car';
  if(t.includes('tree')||t.includes('forest'))return'tree';
  if(t.includes('butterfly'))return'butterfly';
  if(t.includes('heart')||t.includes('love'))return'heart';
  if(t.includes('robot')||t.includes('machine'))return'robot';
  if(t.includes('ship')||t.includes('rocket')||t.includes('spaceship')||t.includes('ufo'))return'spaceship';
  if(t.includes('dragon')||t.includes('snake')||t.includes('serpent'))return'dragon';
  if(t.includes('flower')||t.includes('rose')||t.includes('lotus'))return'flower';
  if(t.includes('galaxy')||t.includes('space')||t.includes('universe'))return'galaxy';
  return'question';
}

function drawSilhouetteObject(type){
  var c=document.getElementById('shapeCanvas'),ctx=c.getContext('2d');
  ctx.clearRect(0,0,c.width,c.height);
  ctx.fillStyle='black';ctx.fillRect(0,0,c.width,c.height);
  ctx.fillStyle='white';ctx.strokeStyle='white';ctx.lineWidth=22;ctx.lineCap='round';ctx.lineJoin='round';
  if(type==='lion')drawLion(ctx);
  else if(type==='fish')drawFish(ctx);
  else if(type==='car')drawCar(ctx);
  else if(type==='tree')drawTree(ctx);
  else if(type==='butterfly')drawButterfly(ctx);
  else if(type==='heart')drawHeart(ctx);
  else if(type==='robot')drawRobot(ctx);
  else if(type==='spaceship')drawSpaceship(ctx);
  else if(type==='dragon')drawDragon(ctx);
  else if(type==='flower')drawFlower(ctx);
  else drawQuestion(ctx);
}

function canvasToParticlesFromMask(type){
  var c=document.getElementById('shapeCanvas'),ctx=c.getContext('2d'),img=ctx.getImageData(0,0,c.width,c.height),d=img.data,pixels=[],edgePixels=[];
  for(var y=2;y<c.height-2;y+=2){
    for(var x=2;x<c.width-2;x+=2){
      var k=(y*c.width+x)*4,b=d[k];
      if(b>35){
        pixels.push({x:x,y:y});
        var b1=d[(y*c.width+x+2)*4],b2=d[(y*c.width+x-2)*4],b3=d[((y+2)*c.width+x)*4],b4=d[((y-2)*c.width+x)*4];
        if(Math.abs(b-b1)+Math.abs(b-b2)+Math.abs(b-b3)+Math.abs(b-b4)>80)edgePixels.push({x:x,y:y});
      }
    }
  }
  applyPixelsToParticles(pixels,edgePixels,type);
}

function applyPixelsToParticles(pixels,edgePixels,type){
  if(pixels.length<20){makeLargeSpace();return}
  var c=document.getElementById('shapeCanvas'),cx=c.width/2,cy=c.height/2,col=getColor(type);
  for(var i=0;i<particleCount;i++){
    var useEdge=Math.random()<.36&&edgePixels.length>30;
    var p=useEdge?edgePixels[(Math.random()*edgePixels.length)|0]:pixels[(Math.random()*pixels.length)|0];
    var px=(p.x-cx)*objectScale,py=-(p.y-cy)*objectScale;
    var dx=(p.x-cx)/cx,dy=(p.y-cy)/cy,dist=Math.min(1,Math.sqrt(dx*dx+dy*dy));
    var depthFactor=Math.max(.18,1-dist*.78);
    var z=gaussianRandom()*maxObjectDepth*depthFactor;
    if(useEdge)z+=(Math.random()<.5?-1:1)*maxObjectDepth*.18*depthFactor;
    var jitter=useEdge?1.45:3.7;
    var near=(z+maxObjectDepth)/(2*maxObjectDepth); near=Math.max(.58,Math.min(1.18,near));
    setParticle(i,px+(Math.random()-.5)*jitter,py+(Math.random()-.5)*jitter,z,col.r*near,col.g*near,col.b*near);
    floatAmp[i]=0; floatAmpY[i]=0;
  }
  geometry.attributes.color.needsUpdate=true;
}

function handleUpload(e){
  var f=e.target.files[0]; if(!f)return;
  var img=new Image();
  img.onload=function(){
    lastUploadImage=img; currentMode='upload'; resetRotation();
    var result=makeUploadMask(img); applyUploadPixelsToParticles(result,'upload');
    rotationTargetY=0.34;
    rotationTargetX=-0.08;
    renderer.domElement.style.cursor='grab';
    document.getElementById('status').innerText='Uploaded image converted to a stronger 3D floating point-cloud face. Drag the mouse to rotate it. Kept pixels: '+result.pixels.length;
  };
  img.src=URL.createObjectURL(f);
}

function makeUploadMask(img){
  var c=document.getElementById('shapeCanvas'),ctx=c.getContext('2d');
  var m=document.getElementById('maskCanvas'),mctx=m.getContext('2d');
  var p=document.getElementById('previewCanvas'),pctx=p.getContext('2d');
  ctx.clearRect(0,0,c.width,c.height); ctx.fillStyle='black'; ctx.fillRect(0,0,c.width,c.height);
  var ratio=Math.min(c.width/img.width,c.height/img.height)*0.9;
  var w=Math.max(1,Math.round(img.width*ratio)),h=Math.max(1,Math.round(img.height*ratio));
  var x=Math.round((c.width-w)/2),y=Math.round((c.height-h)/2);
  ctx.drawImage(img,x,y,w,h);

  var raw=ctx.getImageData(0,0,c.width,c.height),d=raw.data;
  var bg=sampleBorderBackground(d,c.width,c.height);
  var mask=new Uint8Array(c.width*c.height);
  var scoreMap=new Float32Array(c.width*c.height);

  for(var yy=1;yy<c.height-1;yy++){
    for(var xx=1;xx<c.width-1;xx++){
      var id=yy*c.width+xx,k=id*4;
      var r=d[k],g=d[k+1],b=d[k+2],a=d[k+3];
      var maxc=Math.max(r,g,b),minc=Math.min(r,g,b),sat=maxc===0?0:(maxc-minc)/Math.max(1,maxc),bright=(r+g+b)/3;
      var bgDiff=Math.abs(r-bg.r)+Math.abs(g-bg.g)+Math.abs(b-bg.b);
      var edge=edgeStrengthAt(d,c.width,c.height,xx,yy);
      var skin=isPossibleSkin(r,g,b)?28:0;
      var darkBoost=bright<125?(125-bright)*0.22:0;
      var alphaBoost=(a/255)*40;
      var score=bgDiff*1.0 + edge*1.4 + sat*75 + darkBoost + skin + alphaBoost;
      scoreMap[id]=score;
      if(score>78)mask[id]=1;
    }
  }

  for(var pass=0;pass<2;pass++){
    var copy=mask.slice();
    for(var yy=1;yy<c.height-1;yy++){
      for(var xx=1;xx<c.width-1;xx++){
        var id=yy*c.width+xx,n=0;
        for(var oy=-1;oy<=1;oy++)for(var ox=-1;ox<=1;ox++)n+=copy[(yy+oy)*c.width+xx+ox];
        if(copy[id]){ if(n<=2)mask[id]=0; }
        else{ if(n>=6 && scoreMap[id]>56)mask[id]=1; }
      }
    }
  }

  var minX=c.width,minY=c.height,maxX=0,maxY=0,count=0;
  for(var yy=0;yy<c.height;yy++){
    for(var xx=0;xx<c.width;xx++){
      var id=yy*c.width+xx;
      if(mask[id]){count++; if(xx<minX)minX=xx; if(xx>maxX)maxX=xx; if(yy<minY)minY=yy; if(yy>maxY)maxY=yy;}
    }
  }
  if(count<20) return {pixels:[],edges:[]};
  minX=Math.max(0,minX-14); minY=Math.max(0,minY-14); maxX=Math.min(c.width-1,maxX+14); maxY=Math.min(c.height-1,maxY+14);
  var cropW=maxX-minX+1,cropH=maxY-minY+1;

  mctx.clearRect(0,0,m.width,m.height); mctx.fillStyle='black'; mctx.fillRect(0,0,m.width,m.height);
  var maskImage=mctx.createImageData(c.width,c.height);
  for(var yy=0;yy<c.height;yy++){
    for(var xx=0;xx<c.width;xx++){
      var id=yy*c.width+xx,k=id*4;
      if(mask[id]){ maskImage.data[k]=d[k]; maskImage.data[k+1]=d[k+1]; maskImage.data[k+2]=d[k+2]; maskImage.data[k+3]=255; }
    }
  }
  mctx.putImageData(maskImage,0,0);

  pctx.clearRect(0,0,p.width,p.height); pctx.fillStyle='black'; pctx.fillRect(0,0,p.width,p.height);
  var scale=Math.min(p.width/cropW,p.height/cropH)*0.92;
  var dw=Math.round(cropW*scale),dh=Math.round(cropH*scale),dx=Math.round((p.width-dw)/2),dy=Math.round((p.height-dh)/2);
  pctx.drawImage(m,minX,minY,cropW,cropH,dx,dy,dw,dh);

  var sim=pctx.getImageData(0,0,p.width,p.height),sd=sim.data;
  var pixels=[],edges=[];
  var faceCenterY=dy+dh*0.31, faceRadius=Math.min(dw,dh)*0.20;
  for(var yy=1;yy<p.height-1;yy++){
    for(var xx=1;xx<p.width-1;xx++){
      var id=yy*p.width+xx,k=id*4;
      var r=sd[k],g=sd[k+1],b=sd[k+2],a=sd[k+3];
      if(a<8 && r<8 && g<8 && b<8) continue;
      var edge=edgeStrengthAt(sd,p.width,p.height,xx,yy);
      var bright=(r+g+b)/3;
      var faceDist=Math.hypot(xx-p.width/2,yy-faceCenterY);
      var faceBoost=faceDist<faceRadius?2.2:(faceDist<faceRadius*1.8?1.45:1.0);
      var importance=(edge*2.6 + (255-bright)*0.28 + 16)*faceBoost;
      var repetitions=Math.max(1,Math.min(6,Math.round(importance/52)));
      var item={x:xx,y:yy,r:r,g:g,b:b,edge:edge,bright:bright,faceBoost:faceBoost};
      for(var rep=0;rep<repetitions;rep++) pixels.push(item);
      if(edge>23){ edges.push(item); if(faceBoost>1.2)edges.push(item); }
    }
  }

  ctx.clearRect(0,0,c.width,c.height); ctx.fillStyle='black'; ctx.fillRect(0,0,c.width,c.height); ctx.drawImage(p,0,0);
  return {pixels:pixels,edges:edges};
}

function applyUploadPixelsToParticles(result,type){
  var pixels=result.pixels,edgePixels=result.edges;
  if(pixels.length<20){ makeLargeSpace(); document.getElementById('status').innerText='Image object was not detected clearly. Try a portrait with better contrast.'; return; }
  var c=document.getElementById('previewCanvas'),cx=c.width/2,cy=c.height/2;
  var uploadDepth=38;
  for(var i=0;i<particleCount;i++){
    var focusEdge=Math.random()<0.58&&edgePixels.length>30;
    var p=focusEdge?edgePixels[(Math.random()*edgePixels.length)|0]:pixels[(Math.random()*pixels.length)|0];
    var px=(p.x-cx)*objectScale, py=-(p.y-cy)*objectScale;
    var facePriority=p.faceBoost||1.0;
    var edgeAmount=Math.min(1,(p.edge||0)/85);
    var luminance=(p.r*0.299+p.g*0.587+p.b*0.114)/255;
    var xNorm=(p.x-cx)/(c.width*0.30);
    var yNorm=(p.y-cy)/(c.height*0.36);
    var radial=Math.min(1,Math.sqrt(xNorm*xNorm + yNorm*yNorm));
    var centerBulge=(1-radial);
    var noseBias=(0.56-luminance)*uploadDepth*1.12;
    var bulgeDepth=centerBulge*uploadDepth*(0.72 + facePriority*0.16);
    var cheekCurve=-(xNorm*xNorm)*uploadDepth*0.42;
    var foreheadCurve=-(Math.max(0,yNorm+0.08)*Math.max(0,yNorm+0.08))*uploadDepth*0.18;
    var edgeDepth=(focusEdge?(Math.random()-.5)*uploadDepth*0.32*edgeAmount:0);
    var z=bulgeDepth + noseBias + cheekCurve + foreheadCurve + edgeDepth + gaussianRandom()*uploadDepth*(facePriority>1.2?0.06:0.10);
    z=Math.max(-maxObjectDepth*0.96,Math.min(maxObjectDepth*0.96,z));
    var jitter=(focusEdge?0.24:0.62)/(Math.max(1,facePriority*1.02));
    floatAmp[i]=0.55 + facePriority*1.15 + edgeAmount*0.9;
    floatAmpY[i]=0.24 + facePriority*0.7;
    floatPhase[i]=Math.random()*Math.PI*2;
    var rr=enhanceColorChannel(p.r/255,1.2), gg=enhanceColorChannel(p.g/255,1.2), bb=enhanceColorChannel(p.b/255,1.2);
    var depthLight=0.82 + (z/maxObjectDepth)*0.22;
    rr=Math.min(1,Math.max(0.05,rr*depthLight));
    gg=Math.min(1,Math.max(0.05,gg*depthLight));
    bb=Math.min(1,Math.max(0.05,bb*depthLight));
    if(focusEdge){ rr=Math.min(1,rr*1.10+0.04); gg=Math.min(1,gg*1.10+0.04); bb=Math.min(1,bb*1.10+0.04); }
    setParticle(i,px+(Math.random()-.5)*jitter,py+(Math.random()-.5)*jitter,z,rr,gg,bb);
  }
  geometry.attributes.color.needsUpdate=true;
}

function sampleBorderBackground(d,w,h){
  var vals=[];
  for(var x=0;x<w;x+=25){vals.push(readRGB(d,w,x,0));vals.push(readRGB(d,w,x,h-1));}
  for(var y=0;y<h;y+=25){vals.push(readRGB(d,w,0,y));vals.push(readRGB(d,w,w-1,y));}
  vals.sort(function(a,b){return(a[0]+a[1]+a[2])-(b[0]+b[1]+b[2])});
  var slice=vals.slice(Math.floor(vals.length*.25),Math.ceil(vals.length*.75));
