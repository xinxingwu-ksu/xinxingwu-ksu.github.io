<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Virtual Hand</title>
  <style>
    :root {
      --bg1: #0c1222;
      --bg2: #111a31;
      --panel: rgba(255,255,255,0.08);
      --panel-border: rgba(255,255,255,0.14);
      --text: #eef4ff;
      --muted: #b8c5de;
      --accent: #7dd3fc;
      --ok: #86efac;
      --warn: #fcd34d;
      --shadow: rgba(0,0,0,0.32);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 20%, rgba(125, 211, 252, 0.12), transparent 28%),
        radial-gradient(circle at 80% 18%, rgba(134, 239, 172, 0.08), transparent 22%),
        linear-gradient(160deg, var(--bg1), var(--bg2));
    }

    #app {
      position: relative;
      width: 100%;
      height: 100%;
    }

    #avatarCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    #video {
      display: none;
    }

    .hud {
      position: absolute;
      left: 20px;
      top: 20px;
      width: min(440px, calc(100vw - 40px));
      padding: 16px 18px;
      border-radius: 18px;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      backdrop-filter: blur(10px);
      box-shadow: 0 18px 50px rgba(0,0,0,0.22);
      z-index: 10;
    }

    .hud h1 {
      margin: 0 0 8px;
      font-size: 22px;
      line-height: 1.2;
    }

    .hud p {
      margin: 0;
      color: var(--muted);
      line-height: 1.45;
      font-size: 14px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 12px 18px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      color: #071018;
      background: linear-gradient(135deg, #7dd3fc, #a7f3d0);
      box-shadow: 0 10px 25px rgba(0,0,0,0.18);
    }

    button.secondary {
      color: var(--text);
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.16);
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .status {
      margin-top: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--muted);
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--warn);
      box-shadow: 0 0 16px rgba(252, 211, 77, 0.55);
    }

    .dot.active {
      background: var(--ok);
      box-shadow: 0 0 16px rgba(134, 239, 172, 0.55);
    }

    .previewWrap {
      position: absolute;
      right: 20px;
      bottom: 20px;
      width: min(340px, 34vw);
      aspect-ratio: 4 / 3;
      border-radius: 18px;
      overflow: hidden;
      background: rgba(0,0,0,0.32);
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 18px 50px rgba(0,0,0,0.26);
      z-index: 12;
    }

    #previewCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .previewLabel {
      position: absolute;
      left: 10px;
      top: 10px;
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(0,0,0,0.34);
      border: 1px solid rgba(255,255,255,0.16);
      color: #edf4ff;
      z-index: 2;
    }

    .credit {
      position: absolute;
      left: 20px;
      bottom: 20px;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      color: var(--muted);
      font-size: 12px;
      z-index: 10;
    }

    .note {
      margin-top: 10px;
      font-size: 12px;
      color: #d7e6ff;
      opacity: 0.92;
    }

    @media (max-width: 850px) {
      .previewWrap {
        width: 42vw;
      }
      .hud h1 {
        font-size: 20px;
      }
    }

    @media (max-width: 650px) {
      .previewWrap {
        width: 46vw;
        bottom: 14px;
        right: 14px;
      }
      .hud {
        left: 14px;
        top: 14px;
        width: min(460px, calc(100vw - 28px));
      }
      .credit {
        left: 14px;
        bottom: 14px;
        max-width: 46vw;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <canvas id="avatarCanvas"></canvas>
    <video id="video" autoplay playsinline muted></video>

    <div class="hud">
      <h1>Virtual Hand</h1>
      <p>
        Show one hand to your camera. The virtual hand mirrors your palm and all five fingers in real time.
      </p>
      <div class="controls">
        <button id="startBtn">Start Camera</button>
        <button id="togglePreviewBtn" class="secondary">Hide Camera Preview</button>
      </div>
      <div class="status">
        <span id="statusDot" class="dot"></span>
        <span id="statusText">Loading model…</span>
      </div>
      <div class="note">
        Note: keep one hand centered, with fingers visible and enough light on your hand.
      </div>
    </div>

    <div id="previewWrap" class="previewWrap">
      <div class="previewLabel">Camera</div>
      <canvas id="previewCanvas"></canvas>
    </div>

  </div>

  <script type="module">
    import { FilesetResolver, HandLandmarker } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/vision_bundle.mjs";

    const avatarCanvas = document.getElementById("avatarCanvas");
    const avatarCtx = avatarCanvas.getContext("2d");
    const previewCanvas = document.getElementById("previewCanvas");
    const previewCtx = previewCanvas.getContext("2d");
    const video = document.getElementById("video");
    const startBtn = document.getElementById("startBtn");
    const togglePreviewBtn = document.getElementById("togglePreviewBtn");
    const previewWrap = document.getElementById("previewWrap");
    const statusText = document.getElementById("statusText");
    const statusDot = document.getElementById("statusDot");

    let handLandmarker = null;
    let stream = null;
    let webcamRunning = false;
    let previewVisible = true;
    let smoothedHands = [];
    let lastVideoTime = -1;
    let lastDetectionAt = 0;
    let missedDetections = 0;
    let stageW = 0;
    let stageH = 0;

    const GUIDE_HAND = [
      { x: 0.50, y: 0.75, z: 0.00 },
      { x: 0.42, y: 0.65, z: -0.02 },
      { x: 0.35, y: 0.55, z: -0.03 },
      { x: 0.30, y: 0.42, z: -0.04 },
      { x: 0.27, y: 0.31, z: -0.05 },
      { x: 0.48, y: 0.57, z: -0.01 },
      { x: 0.46, y: 0.42, z: -0.02 },
      { x: 0.45, y: 0.28, z: -0.03 },
      { x: 0.44, y: 0.15, z: -0.04 },
      { x: 0.56, y: 0.54, z: -0.01 },
      { x: 0.56, y: 0.38, z: -0.02 },
      { x: 0.56, y: 0.23, z: -0.03 },
      { x: 0.56, y: 0.08, z: -0.04 },
      { x: 0.64, y: 0.57, z: -0.01 },
      { x: 0.66, y: 0.44, z: -0.02 },
      { x: 0.68, y: 0.31, z: -0.03 },
      { x: 0.70, y: 0.18, z: -0.04 },
      { x: 0.71, y: 0.63, z: 0.00 },
      { x: 0.76, y: 0.53, z: -0.01 },
      { x: 0.80, y: 0.43, z: -0.02 },
      { x: 0.83, y: 0.34, z: -0.03 }
    ];

    function setStatus(text, active = false) {
      statusText.textContent = text;
      statusDot.classList.toggle("active", active);
    }

    function resizeCanvases() {
      stageW = window.innerWidth;
      stageH = window.innerHeight;
      avatarCanvas.width = stageW * devicePixelRatio;
      avatarCanvas.height = stageH * devicePixelRatio;
      avatarCanvas.style.width = stageW + "px";
      avatarCanvas.style.height = stageH + "px";
      avatarCtx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);

      const rect = previewWrap.getBoundingClientRect();
      previewCanvas.width = Math.max(1, Math.floor(rect.width * devicePixelRatio));
      previewCanvas.height = Math.max(1, Math.floor(rect.height * devicePixelRatio));
      previewCtx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
    }

    window.addEventListener("resize", resizeCanvases);
    resizeCanvases();

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    function distance(a, b) {
      const dx = a.x - b.x;
      const dy = a.y - b.y;
      return Math.hypot(dx, dy);
    }

    function midpoint(a, b) {
      return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    }

    function normalize(vx, vy) {
      const d = Math.hypot(vx, vy) || 1;
      return { x: vx / d, y: vy / d };
    }

    function toStagePoint(lm) {
      return {
        x: (1 - lm.x) * stageW,
        y: lm.y * stageH,
        z: lm.z || 0
      };
    }

    function smoothLandmarks(rawHands) {
      const alpha = 0.42;
      if (!rawHands.length) {
        return [];
      }

      if (smoothedHands.length !== rawHands.length) {
        smoothedHands = rawHands.map(hand => hand.map(lm => ({ ...lm })));
        return smoothedHands;
      }

      smoothedHands = rawHands.map((hand, handIndex) => {
        return hand.map((lm, i) => {
          const prev = smoothedHands[handIndex][i] || lm;
          const motion = Math.abs(lm.x - prev.x) + Math.abs(lm.y - prev.y);
          const dynamicAlpha = Math.min(0.72, alpha + motion * 3.0);
          return {
            x: lerp(prev.x, lm.x, dynamicAlpha),
            y: lerp(prev.y, lm.y, dynamicAlpha),
            z: lerp(prev.z || 0, lm.z || 0, dynamicAlpha)
          };
        });
      });

      return smoothedHands;
    }

    function clearTrackedHand() {
      smoothedHands = [];
      missedDetections = 0;
      lastDetectionAt = 0;
    }

    function roundedPolygon(ctx, points, radius = 18) {
      if (!points.length) return;
      if (points.length < 3) {
        ctx.beginPath();
        ctx.moveTo(points[0].x, points[0].y);
        for (let i = 1; i < points.length; i++) ctx.lineTo(points[i].x, points[i].y);
        return;
      }

      ctx.beginPath();
      for (let i = 0; i < points.length; i++) {
        const prev = points[(i - 1 + points.length) % points.length];
        const curr = points[i];
        const next = points[(i + 1) % points.length];

        const v1 = normalize(curr.x - prev.x, curr.y - prev.y);
        const v2 = normalize(next.x - curr.x, next.y - curr.y);

        const p1 = { x: curr.x - v1.x * radius, y: curr.y - v1.y * radius };
        const p2 = { x: curr.x + v2.x * radius, y: curr.y + v2.y * radius };

        if (i === 0) ctx.moveTo(p1.x, p1.y);
        else ctx.lineTo(p1.x, p1.y);

        ctx.quadraticCurveTo(curr.x, curr.y, p2.x, p2.y);
      }
      ctx.closePath();
    }

    function drawSegment(a, b, width, color, shadow = true) {
      if (shadow) {
        avatarCtx.strokeStyle = "rgba(0,0,0,0.22)";
        avatarCtx.lineWidth = width + 8;
        avatarCtx.lineCap = "round";
        avatarCtx.lineJoin = "round";
        avatarCtx.beginPath();
        avatarCtx.moveTo(a.x + 3, a.y + 5);
        avatarCtx.lineTo(b.x + 3, b.y + 5);
        avatarCtx.stroke();
      }

      avatarCtx.strokeStyle = color;
      avatarCtx.lineWidth = width;
      avatarCtx.lineCap = "round";
      avatarCtx.lineJoin = "round";
      avatarCtx.beginPath();
      avatarCtx.moveTo(a.x, a.y);
      avatarCtx.lineTo(b.x, b.y);
      avatarCtx.stroke();

      const n = normalize(-(b.y - a.y), b.x - a.x);
      avatarCtx.strokeStyle = "rgba(255,255,255,0.16)";
      avatarCtx.lineWidth = Math.max(2, width * 0.12);
      avatarCtx.beginPath();
      avatarCtx.moveTo(a.x + n.x * width * 0.16, a.y + n.y * width * 0.16);
      avatarCtx.lineTo(b.x + n.x * width * 0.16, b.y + n.y * width * 0.16);
      avatarCtx.stroke();
    }

    function drawJoint(p, r, baseColor) {
      const grad = avatarCtx.createRadialGradient(
        p.x - r * 0.25,
        p.y - r * 0.3,
        r * 0.2,
        p.x,
        p.y,
        r
      );
      grad.addColorStop(0, "rgba(255,255,255,0.25)");
      grad.addColorStop(0.42, baseColor);
      grad.addColorStop(1, "rgba(150,104,80,0.96)");

      avatarCtx.fillStyle = "rgba(0,0,0,0.18)";
      avatarCtx.beginPath();
      avatarCtx.arc(p.x + 2, p.y + 3, r + 2, 0, Math.PI * 2);
      avatarCtx.fill();

      avatarCtx.fillStyle = grad;
      avatarCtx.beginPath();
      avatarCtx.arc(p.x, p.y, r, 0, Math.PI * 2);
      avatarCtx.fill();
    }

    function drawNail(base, tip, size) {
      const dir = normalize(tip.x - base.x, tip.y - base.y);
      const n = normalize(-dir.y, dir.x);
      const center = {
        x: tip.x - dir.x * size * 0.78,
        y: tip.y - dir.y * size * 0.78
      };

      avatarCtx.save();
      avatarCtx.translate(center.x, center.y);
      avatarCtx.rotate(Math.atan2(dir.y, dir.x));
      avatarCtx.fillStyle = "rgba(255, 230, 225, 0.92)";
      avatarCtx.beginPath();
      avatarCtx.ellipse(0, 0, size * 0.46, size * 0.32, 0, 0, Math.PI * 2);
      avatarCtx.fill();
      avatarCtx.strokeStyle = "rgba(168, 116, 105, 0.46)";
      avatarCtx.lineWidth = 1.3;
      avatarCtx.stroke();
      avatarCtx.restore();
    }

    function drawPalm(points, palmScale) {
      const palm = [points[0], points[1], points[2], points[5], points[9], points[13], points[17]];
      roundedPolygon(avatarCtx, palm, 16 * palmScale);

      const palmGradient = avatarCtx.createLinearGradient(points[0].x, points[0].y, points[9].x, points[9].y - 90);
      palmGradient.addColorStop(0, "rgba(186, 131, 102, 0.98)");
      palmGradient.addColorStop(0.55, "rgba(232, 193, 165, 0.99)");
      palmGradient.addColorStop(1, "rgba(246, 216, 194, 0.98)");

      avatarCtx.fillStyle = "rgba(0,0,0,0.18)";
      avatarCtx.save();
      avatarCtx.translate(4, 6);
      roundedPolygon(avatarCtx, palm, 16 * palmScale);
      avatarCtx.fill();
      avatarCtx.restore();

      roundedPolygon(avatarCtx, palm, 16 * palmScale);
      avatarCtx.fillStyle = palmGradient;
      avatarCtx.fill();

      avatarCtx.strokeStyle = "rgba(135, 94, 73, 0.55)";
      avatarCtx.lineWidth = 1.7;
      avatarCtx.stroke();

      const c1 = midpoint(points[0], points[9]);
      const c2 = midpoint(points[5], points[17]);
      avatarCtx.strokeStyle = "rgba(160, 108, 86, 0.30)";
      avatarCtx.lineWidth = 2;
      avatarCtx.beginPath();
      avatarCtx.moveTo(c1.x - 10, c1.y + 10);
      avatarCtx.quadraticCurveTo(c2.x, c2.y, points[13].x - 10, points[13].y + 6);
      avatarCtx.stroke();

      avatarCtx.beginPath();
      avatarCtx.moveTo(points[0].x + 8, points[0].y - 10);
      avatarCtx.quadraticCurveTo(c1.x - 12, c1.y - 4, points[5].x + 8, points[5].y + 2);
      avatarCtx.stroke();
    }

    function drawForearm(points, palmScale) {
      const wrist = points[0];
      const palmCenter = midpoint(points[5], points[17]);
      const dir = normalize(wrist.x - palmCenter.x, wrist.y - palmCenter.y);
      const n = normalize(-dir.y, dir.x);
      const armLen = 115 * palmScale;
      const armHalf = 30 * palmScale;
      const endCenter = {
        x: wrist.x + dir.x * armLen,
        y: wrist.y + dir.y * armLen
      };
      const pts = [
        { x: wrist.x + n.x * armHalf * 0.9, y: wrist.y + n.y * armHalf * 0.9 },
        { x: wrist.x - n.x * armHalf * 0.9, y: wrist.y - n.y * armHalf * 0.9 },
        { x: endCenter.x - n.x * armHalf * 0.62, y: endCenter.y - n.y * armHalf * 0.62 },
        { x: endCenter.x + n.x * armHalf * 0.62, y: endCenter.y + n.y * armHalf * 0.62 }
      ];

      avatarCtx.save();
      avatarCtx.fillStyle = "rgba(0,0,0,0.15)";
      avatarCtx.translate(3, 6);
      roundedPolygon(avatarCtx, pts, 16 * palmScale);
      avatarCtx.fill();
      avatarCtx.restore();

      const grad = avatarCtx.createLinearGradient(pts[0].x, pts[0].y, pts[2].x, pts[2].y);
      grad.addColorStop(0, "rgba(195, 142, 112, 0.98)");
      grad.addColorStop(1, "rgba(239, 200, 174, 0.98)");
      roundedPolygon(avatarCtx, pts, 16 * palmScale);
      avatarCtx.fillStyle = grad;
      avatarCtx.fill();
      avatarCtx.strokeStyle = "rgba(132, 90, 70, 0.28)";
      avatarCtx.lineWidth = 1.5;
      avatarCtx.stroke();
    }

    function drawFinger(points, chain, widths, color) {
      for (let i = 0; i < chain.length - 1; i++) {
        const a = points[chain[i]];
        const b = points[chain[i + 1]];
        drawSegment(a, b, widths[i], color, true);
      }

      for (let i = 0; i < chain.length - 1; i++) {
        drawJoint(points[chain[i + 1]], Math.max(6, widths[i] * 0.42), color);
      }

      const tip = points[chain[chain.length - 1]];
      const prev = points[chain[chain.length - 2]];
      drawNail(prev, tip, Math.max(11, widths[widths.length - 1] * 0.9));
    }

    function drawHand(rawLandmarks, opacity = 1) {
      const points = rawLandmarks.map(toStagePoint);
      const palmWidth = distance(points[5], points[17]);
      const palmScale = Math.max(0.72, Math.min(1.55, palmWidth / 120));
      const skin = `rgba(230, 191, 163, ${opacity})`;

      avatarCtx.save();
      avatarCtx.globalAlpha = opacity;
      drawForearm(points, palmScale);
      drawPalm(points, palmScale);

      const fingerDefs = [
        { chain: [17, 18, 19, 20], widths: [21, 18, 15], depth: avgZ(rawLandmarks, [17,18,19,20]) },
        { chain: [13, 14, 15, 16], widths: [24, 20, 17], depth: avgZ(rawLandmarks, [13,14,15,16]) },
        { chain: [9, 10, 11, 12], widths: [27, 23, 19], depth: avgZ(rawLandmarks, [9,10,11,12]) },
        { chain: [5, 6, 7, 8], widths: [24, 20, 17], depth: avgZ(rawLandmarks, [5,6,7,8]) },
        { chain: [1, 2, 3, 4], widths: [23, 20, 16], depth: avgZ(rawLandmarks, [1,2,3,4]) }
      ];

      fingerDefs.sort((a, b) => b.depth - a.depth);
      for (const finger of fingerDefs) {
        drawFinger(points, finger.chain, finger.widths.map(w => w * palmScale), skin);
      }

      drawJoint(points[0], 12 * palmScale, skin);
      avatarCtx.restore();
    }

    function avgZ(lms, ids) {
      let sum = 0;
      for (const i of ids) sum += lms[i].z || 0;
      return sum / ids.length;
    }

    function drawBackground() {
      avatarCtx.clearRect(0, 0, stageW, stageH);

      const bg = avatarCtx.createLinearGradient(0, 0, stageW, stageH);
      bg.addColorStop(0, "#0b1020");
      bg.addColorStop(1, "#14203b");
      avatarCtx.fillStyle = bg;
      avatarCtx.fillRect(0, 0, stageW, stageH);

      const glow1 = avatarCtx.createRadialGradient(stageW * 0.25, stageH * 0.28, 20, stageW * 0.25, stageH * 0.28, stageW * 0.35);
      glow1.addColorStop(0, "rgba(125, 211, 252, 0.18)");
      glow1.addColorStop(1, "rgba(125, 211, 252, 0)");
      avatarCtx.fillStyle = glow1;
      avatarCtx.fillRect(0, 0, stageW, stageH);

      const glow2 = avatarCtx.createRadialGradient(stageW * 0.78, stageH * 0.18, 20, stageW * 0.78, stageH * 0.18, stageW * 0.22);
      glow2.addColorStop(0, "rgba(134, 239, 172, 0.12)");
      glow2.addColorStop(1, "rgba(134, 239, 172, 0)");
      avatarCtx.fillStyle = glow2;
      avatarCtx.fillRect(0, 0, stageW, stageH);

      avatarCtx.strokeStyle = "rgba(255,255,255,0.04)";
      avatarCtx.lineWidth = 1;
      for (let x = 0; x < stageW; x += 42) {
        avatarCtx.beginPath();
        avatarCtx.moveTo(x, 0);
        avatarCtx.lineTo(x, stageH);
        avatarCtx.stroke();
      }
      for (let y = 0; y < stageH; y += 42) {
        avatarCtx.beginPath();
        avatarCtx.moveTo(0, y);
        avatarCtx.lineTo(stageW, y);
        avatarCtx.stroke();
      }
    }

    function drawGuideHand() {
      avatarCtx.save();
      const guide = GUIDE_HAND.map(p => ({
        x: lerp(0.18, 0.82, p.x),
        y: lerp(0.10, 0.90, p.y),
        z: p.z
      }));
      drawHand(guide, 0.46);
      avatarCtx.restore();

      avatarCtx.fillStyle = "rgba(240,247,255,0.90)";
      avatarCtx.font = "600 20px Arial";
      avatarCtx.fillText("Show your hand to the camera", 40, stageH - 88);
      avatarCtx.fillStyle = "rgba(191,207,232,0.95)";
      avatarCtx.font = "14px Arial";
      avatarCtx.fillText("The avatar mirrors your wrist and all five fingers once tracking starts.", 40, stageH - 58);
    }

    function drawPreview(handPoints = null) {
      const w = previewWrap.clientWidth;
      const h = previewWrap.clientHeight;
      previewCtx.clearRect(0, 0, w, h);

      if (video.readyState >= 2) {
        previewCtx.save();
        previewCtx.translate(w, 0);
        previewCtx.scale(-1, 1);
        previewCtx.drawImage(video, 0, 0, w, h);
        previewCtx.restore();
      } else {
        previewCtx.fillStyle = "#0c1528";
        previewCtx.fillRect(0, 0, w, h);
      }

      previewCtx.fillStyle = "rgba(8,12,24,0.20)";
      previewCtx.fillRect(0, 0, w, h);

      if (handPoints && handPoints.length) {
        const pts = handPoints.map(p => ({ x: (1 - p.x) * w, y: p.y * h }));
        const connections = [
          [0,1],[1,2],[2,3],[3,4],
          [0,5],[5,6],[6,7],[7,8],
          [5,9],[9,10],[10,11],[11,12],
          [9,13],[13,14],[14,15],[15,16],
          [13,17],[17,18],[18,19],[19,20],
          [0,17]
        ];
        previewCtx.strokeStyle = "rgba(125,211,252,0.85)";
        previewCtx.lineWidth = 3;
        previewCtx.lineCap = "round";
        for (const [a,b] of connections) {
          previewCtx.beginPath();
          previewCtx.moveTo(pts[a].x, pts[a].y);
          previewCtx.lineTo(pts[b].x, pts[b].y);
          previewCtx.stroke();
        }
        for (const p of pts) {
          previewCtx.fillStyle = "rgba(167,243,208,0.95)";
          previewCtx.beginPath();
          previewCtx.arc(p.x, p.y, 4, 0, Math.PI * 2);
          previewCtx.fill();
        }
      }
    }

    async function setupHandLandmarker() {
      try {
        setStatus("Loading model…", false);
        const vision = await FilesetResolver.forVisionTasks(
          "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm"
        );

        handLandmarker = await HandLandmarker.createFromOptions(vision, {
          baseOptions: {
            modelAssetPath:
              "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task"
          },
          runningMode: "VIDEO",
          numHands: 1,
          minHandDetectionConfidence: 0.6,
          minHandPresenceConfidence: 0.6,
          minTrackingConfidence: 0.6
        });

        setStatus("Model ready. Start the camera.", false);
      } catch (error) {
        console.error(error);
        setStatus("Could not load MediaPipe model.", false);
      }
    }

    async function startCamera() {
      if (webcamRunning) return;
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: "user",
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        });
        video.srcObject = stream;
        await video.play();
        webcamRunning = true;
        clearTrackedHand();
        lastVideoTime = -1;
        startBtn.disabled = true;
        setStatus("Camera running. Show one hand.", true);
        requestAnimationFrame(renderLoop);
      } catch (error) {
        console.error(error);
        setStatus("Camera access was blocked or unavailable.", false);
      }
    }

    function renderLoop() {
      drawBackground();

      let firstHand = null;
      if (webcamRunning && handLandmarker && video.readyState >= 2) {
        const now = performance.now();
        if (video.currentTime !== lastVideoTime) {
          const result = handLandmarker.detectForVideo(video, now);
          lastVideoTime = video.currentTime;

          if (result.landmarks && result.landmarks.length) {
            const smooth = smoothLandmarks(result.landmarks);
            firstHand = smooth[0];
            lastDetectionAt = now;
            missedDetections = 0;
          } else {
            missedDetections += 1;
            if (missedDetections >= 2) {
              clearTrackedHand();
            }
          }
        }
      }

      const recentlySeen = smoothedHands.length && performance.now() - lastDetectionAt < 120;
      if (recentlySeen && smoothedHands.length) {
        drawHand(smoothedHands[0], 1);
        setStatus("Tracking hand and fingers.", true);
      } else {
        drawGuideHand();
        if (webcamRunning && handLandmarker) {
          setStatus("Looking for a clear hand…", false);
        }
      }

      if (previewVisible) {
        drawPreview(recentlySeen ? smoothedHands[0] : null);
      }

      requestAnimationFrame(renderLoop);
    }

    togglePreviewBtn.addEventListener("click", () => {
      previewVisible = !previewVisible;
      previewWrap.style.display = previewVisible ? "block" : "none";
      togglePreviewBtn.textContent = previewVisible ? "Hide Camera Preview" : "Show Camera Preview";
      resizeCanvases();
    });

    startBtn.addEventListener("click", startCamera);

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setStatus("This browser does not support webcam access.", false);
    }

    setupHandLandmarker();
    drawBackground();
    drawGuideHand();
  </script>
</body>
</html>
