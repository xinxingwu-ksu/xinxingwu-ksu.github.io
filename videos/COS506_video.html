<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>COS506 Course Syllabus (Video Version)</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: min(900px, 95vw);
      text-align: center;
      background: #1b1b1b;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.35);

    h1 {
      margin-top: 0;
      font-size: 28px;
    }

    p {
      color: #d0d0d0;
      margin-bottom: 18px;
    }

    video {
      width: 100%;
      max-height: 80vh;
      border-radius: 10px;
      background: black;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>COS506 Course Syllabus (Video Version)</h1>
	
    <video controls>
      <source src="COS506.mp4" type="video/mp4" />

    </video>
  </div>

</html>
