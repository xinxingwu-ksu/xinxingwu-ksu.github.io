  <style>
    * { box-sizing: border-box; }
    html { color-scheme: light; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px 18px;
      background: #fff;
      color: #000;
      font-family: Arial, Helvetica, sans-serif;

    .qr { display: block; width: min(60vw, 214px); height: auto; margin: 0 auto 26px; image-rendering: crisp-edges; }
    h1 { margin: 0 0 24px; font-size: clamp(24px, 5vw, 29px); font-weight: 600; }
    input, button { width: 100%; min-height: 54px; border: 1px solid #000; border-radius: 6px; font: inherit; font-size: 17px; }
    input { padding: 12px 14px; background: #fff; color: #000; }
    input::placeholder { color: #666; }
    button { margin-top: 12px; background: #fff; color: #000; font-weight: 600; cursor: pointer; }
    button:hover { background: #f4f4f4; }
    button:focus-visible, input:focus-visible { outline: 2px solid #000; outline-offset: 3px; }
    .error { min-height: 20px; margin: 12px 0 0; font-size: 14px; color: #000; }
    @media (max-width: 420px) { .qr { width: min(63vw, 205px); } }

    <h1>Enter the Key</h1>
    <form id="keyForm" novalidate>
      <input id="key" type="password" placeholder="Jesus is the Key" aria-label="Access key" autocomplete="off" required>
      <button type="submit">Enter</button>
	  <p><strong>Note</strong>: The link will be available until November 6, 2026 😊 Please download your favorite photos before then. Thanks!</p>
      <p class="error" id="error" role="status" aria-live="polite"></p>
    </form>
  </main>
  <script>
    // This is a visual key-entry page, not secure server-side authentication.
    const CORRECT_KEY = "Jesus";
    const form = document.getElementById("keyForm");
    const input = document.getElementById("key");
    const error = document.getElementById("error");
    input.addEventListener("input", () => error.textContent = "");
    form.addEventListener("submit", event => {
      event.preventDefault();
      if (input.value === CORRECT_KEY) {
        location.href = "gallery.html";
      } else {
        error.textContent = input.value ? "Incorrect key. Please try again." : "Please enter the key.";
        input.value = "";
        input.focus();
      }
    });
  </script>
